[project]
name = "mykube"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "autometrics>=1.0.0",
    "boto3>=1.43.62",
    "celery>=5.6.3",
    "daphne>=4.2.3",
    "django>=6.0.5",
    "django-celery-beat>=2.9.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "django-filter>=26.1",
    "django-mcp>=0.3.1",
    "django-mcp-server>=0.5.7",
    "django-ninja>=1.6.2",
    "django-oauth-toolkit>=3.4.0",
    "django-oauth-toolkit-dcr>=0.1.0",
    "django-redis>=6.0.0",
    "django-redis-cache>=1.8.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "firebase-admin>=7.5.0",
    "graphene-django>=3.2.3",
    "gunicorn>=26.0.0",
    "httpx2>=2.9.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "twisted[http2,tls]>=26.4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "coverage>=7.13.4",
    "django-browser-reload>=1.21.0",
    "django-watchfiles>=1.4.0",
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-aio>=2.1.7",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-playwright>=0.7.2",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]

[tool.pyright]
typeCheckingMode = "off"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
timeout="5000"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest.ini_options]

[tool.pytest_env]
env_files = [".env", ".env.test"]


[tool.autopep8]
max_line_length = 120
# ignore = "E501,W6"  # or ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3
